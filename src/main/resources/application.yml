spring:
  application:
    name: BeEyes

  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 连接池名称
      pool-name: HikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒）
      idle-timeout: 600000
      # 连接最大存活时间
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 0
          min-idle: 0
          max-wait: -1ms
  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_ENDPOINT}
    # 生产者配置
    producer:
      # 消息key的序列化器
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 消息value的序列化器
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 批次大小，当批次满了之后才会发送
      batch-size: 16384
      # 缓冲区大小
      buffer-memory: 33554432
      # 消息确认机制：0-不需要确认，1-只需要leader确认，all-所有副本都需要确认
      acks: all
      # 重试次数
      retries: 3
      # 重试间隔时间

    # 消费者配置
    consumer:
      # 消息key的反序列化器
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 消息value的反序列化器
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # 消费者组ID
      group-id: default-group
      # 自动偏移量重置策略：earliest-从头开始消费，latest-从最新的开始消费，none-如果没有偏移量则抛出异常
      auto-offset-reset: earliest
      # 是否自动提交偏移量
      enable-auto-commit: false
      # 自动提交偏移量的间隔时间
      auto-commit-interval: 1000
      # 指定JsonDeserializer反序列化的目标类
      properties:
        spring:
          json:
            trusted:
              packages: "*"

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-sql: true
  database-validation-mode: ERROR
  client:
    openapi:
      path: /swagger/openapi.yml
      ui-path: /swagger/openapi.html
      properties:
        info:
          title: BeEyes API
          description: BeEyes API
          version: 0.1.0

sa-token:
  token-name: beeyes-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: tik
  is-log: true

influx-db:
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  bucket: ${INFLUXDB_BUCKET}
  org: ${INFLUXDB_ORG}

encrypt:
  key: edw56sw57wgh8ui9 # length 16
